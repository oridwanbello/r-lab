name: Safety-Check
on:
    pull_request:
        branches: [ main, staging, dev ]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Lint and Compile
              run: |
                  npm run lint
                  npm run compile
